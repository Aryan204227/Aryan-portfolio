# Final fact-check update: corrected career-option wording in preview branch.
name: Deploy Cinematic Scroll Preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish cinematic preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/cinematic-scroll

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview for GitHub Pages
        run: npm run build -- --base=/Aryan-portfolio/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live page and portrait asset
        shell: bash
        run: |
          set -euo pipefail
          page_url="https://aryan204227.github.io/Aryan-portfolio/"
          image_url="https://aryan204227.github.io/Aryan-portfolio/aryan-profile.jpg"
          for attempt in $(seq 1 12); do
            page_status="$(curl --location --silent --show-error --output /tmp/portfolio-page.html --write-out '%{http_code}' "$page_url" || true)"
            image_status="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' "$image_url" || true)"
            if [ "$page_status" = "200" ] && [ "$image_status" = "200" ] && grep -qi "Aryan Dadwal" /tmp/portfolio-page.html; then
              echo "Live page responded with HTTP 200; portrait asset is reachable with HTTP 200."
              exit 0
            fi
            echo "Attempt $attempt: page HTTP ${page_status:-unknown}, portrait HTTP ${image_status:-unknown}; retrying..."
            sleep 10
          done
          echo "Live page or portrait asset did not return the expected response in time."
          exit 1

      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium for scroll verification
        run: npx playwright install --with-deps chromium

      - name: Verify scroll animations and navigation in a real browser
        run: node scripts/portfolio-smoke.mjs
        env:
          PORTFOLIO_URL: https://aryan204227.github.io/Aryan-portfolio/
