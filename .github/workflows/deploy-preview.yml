name: Deploy Cinematic Scroll Preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish cinematic preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/cinematic-scroll

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview for GitHub Pages
        run: npm run build -- --base=/Aryan-portfolio/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public preview URL
        shell: bash
        run: |
          set -euo pipefail
          url="https://aryan204227.github.io/Aryan-portfolio/"
          for attempt in $(seq 1 12); do
            status="$(curl --location --silent --show-error --output /tmp/portfolio-page.html --write-out '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ] && grep -q "Aryan Dadwal" /tmp/portfolio-page.html; then
              echo "Live preview responded with HTTP 200 and expected portfolio title."
              exit 0
            fi
            echo "Attempt $attempt: page not ready yet (HTTP ${status:-unknown}); retrying..."
            sleep 10
          done
          echo "Preview URL did not return the expected page in time."
          exit 1
