name: Portfolio Build

on:
  push:
    branches:
      - fix/3d-engineering-visuals
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vite portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Save built site artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aryan-portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
